<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Piano - Acceso</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="left-panel">

        <p class="panel-eyebrow">
            ✦ Academia de Piano
        </p>

        <h1 class="panel-title">
            Música<br>que <em>transforma</em>
        </h1>

        <p class="panel-desc">
            Únete a nuestra comunidad de músicos.
            Aprende a tu ritmo con los mejores maestros.
        </p>

    </div>

    <div class="right-panel">

        <div class="tabs" style="max-width:400px;width:100%;">

            <button class="tab activo" onclick="mostrarTab('login')">
                Iniciar Sesión
            </button>

            <button class="tab" onclick="mostrarTab('registro')">
                Registrarse
            </button>

        </div>

        <div class="formulario activo" id="form-login">

            <h2 class="form-title">
                Bienvenido
            </h2>

            <span class="form-subtitle-small">
                ✦ Accede a tu cuenta
            </span>

            <input type="email" id="login-email" placeholder="Correo electrónico" required>

            <input type="password" id="login-password" placeholder="Contraseña" required>

            <div class="mensaje" id="msg-login"></div>

            <button type="submit" onclick="iniciarSesion()">
                Entrar
            </button>

        </div>

        <div class="formulario" id="form-registro">

            <h2 class="form-title">
                Crear cuenta
            </h2>

            <span class="form-subtitle-small">
                ✦ Únete a la academia
            </span>

            <input type="text" id="reg-nombre" placeholder="Nombre completo" required>

            <input type="email" id="reg-email" placeholder="Correo electrónico" required>

            <input type="password" id="reg-password" placeholder="Contraseña" required>

            <div class="mensaje" id="msg-registro"></div>

            <button type="submit" onclick="registrarse()">
                Crear cuenta
            </button>

        </div>

        <div class="formulario" id="form-verificacion">

            <h2 class="form-title">
                Verificar cuenta
            </h2>

            <span class="form-subtitle-small">
                ✦ Ingresa el código enviado a tu correo
            </span>

            <input type="text" id="codigo-verificacion" placeholder="Código de 6 dígitos" required>

            <div class="mensaje" id="msg-verificacion"></div>

            <button type="submit" onclick="verificarCodigo()">
                Verificar código
            </button>

        </div>

        <a href="/" class="volver">
            ← Volver al inicio
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
